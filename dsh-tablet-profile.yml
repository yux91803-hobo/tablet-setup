# 平板（DSH Go）连 li、li2 时用的配置：网关线路和默认模型。
# 手动维护：网关里的模型变了就改这里（id 要和网关里的一致）；装机脚本把它放到 ~/.dsh/profiles/web/cordis.patch.yml。
- id: llm-pi-ai
  config:
    providers:
      xin-gateway:
        displayName: "WorkBuddy 网关"
        apiKeyEnv: XIN_HARNESS_KEY
        api: openai-responses
        baseURL: "http://127.0.0.1:8788/v1"
        models:
          - id: "deepseek-v4.1-flash"
            name: "DeepSeek V4.1 Flash"
            contextWindow: 1000000
            input: ["text","image"]
            reasoningEfforts:
              off: none
              low: low
              high: high
              max: max
          - id: "glm-5.4"
            name: "GLM-5.4"
            contextWindow: 1000000
            input: ["text","image"]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: "kimi-k3.1-pro"
            name: "Kimi K3.1 Pro"
            contextWindow: 1000000
            input: ["text","image"]
            reasoningEfforts:
              low: low
              high: high
              max: max
- id: agent-default-model
  config:
    provider: xin-gateway
    model: "deepseek-v4.1-flash"
    reasoningEffort: high
